<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostal2 | Início</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/componentes.js" defer></script>
</head>
<body>
    <nostal2-header></nostal2-header>
    <h2> Bem vindo! </h2>
    <p> Aqui você encontra todos os consoles e jogos clássicos que fizeram a sua infância! </p>
    <section class="carousel-section">
        <div class="carousel">
            <div class="carousel-track">
                <article class="carousel-item">
                    <img src="../img/colecao.png" alt="Coleção de jogos clássicos">
                </article>
                <article class="carousel-item">
                    <img src="../img/classicos-do-ps2.png" alt="Clássicos do PS2">
                </article>
                <article class="carousel-item">
                    <img src="../img/images.jpg" alt="Imagem da coleção">
                </article>
            </div>
            <button class="carousel-button prev" aria-label="Anterior">‹</button>
            <button class="carousel-button next" aria-label="Próximo">›</button>
        </div>
    </section>
    <section class="novidades">
        <h3> Novidades da semana! </h3>
        <div class="categoria-bloco jogos-bloco">
                <div class="categoria-titulo">
                    <h3>Jogos</h3>
                    <span class="linha-decorativa"></span>
                </div>
                <div id="container-jogos" class="grid-produtos"></div>
            </div>

            <div class="categoria-bloco consoles-bloco">
                <div class="categoria-titulo">
                    <h3>Consoles</h3>
                    <span class="linha-decorativa"></span>
                </div>
                <div id="container-consoles" class="grid-produtos"></div>
            </div>
    </section>
    <script src="../js/app.js"></script>
</body>
</html>
